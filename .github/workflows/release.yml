name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: .exe
            archive: zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ''
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-15-intel
            ext: ''
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ''
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage release bundle (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          PKG="studia-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "dist/${PKG}"
          cp "target/${{ matrix.target }}/release/studia" "dist/${PKG}/"
          cp README.md README.tr.md LICENSE .env.example "dist/${PKG}/"
          cp -r examples "dist/${PKG}/"
          tar -C dist -czf "${PKG}.tar.gz" "${PKG}"
          shasum -a 256 "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"

      - name: Stage release bundle (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = "studia-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$pkg" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/studia.exe" "dist/$pkg/"
          Copy-Item README.md, README.tr.md, LICENSE, .env.example "dist/$pkg/"
          Copy-Item -Recurse examples "dist/$pkg/"
          Compress-Archive -Path "dist/$pkg" -DestinationPath "$pkg.zip" -Force
          $hash = (Get-FileHash -Algorithm SHA256 "$pkg.zip").Hash.ToLowerInvariant()
          "$hash  $pkg.zip" | Out-File -Encoding ascii "$pkg.zip.sha256"

      - name: Upload target artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            studia-*.tar.gz
            studia-*.tar.gz.sha256
            studia-*.zip
            studia-*.zip.sha256

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Combine SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          cat *.sha256 > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/studia-*.tar.gz
            artifacts/studia-*.zip
            artifacts/*.sha256
            artifacts/SHA256SUMS.txt
