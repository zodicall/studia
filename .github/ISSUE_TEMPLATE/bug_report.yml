name: Bug Report
description: Report a bug or unexpected behavior in studia
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Description
      description: Clear summary of what happened and what you expected.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: studia Version
      placeholder: "studia 0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `studia doctor`
      description: Paste the output of `studia doctor` (never include raw API keys or tokens).
      render: text
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
    validations:
      required: true
